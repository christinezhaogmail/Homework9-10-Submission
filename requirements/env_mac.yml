name: ai-research-assistant-mac
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      # Core AI/ML Libraries
      - langchain==0.1.0
      - langchain-core==0.1.10
      - langchain-community==0.0.13
      - openai==1.6.1
      - tiktoken==0.5.2

      # LLM Integration
      - ollama==0.1.6

      # Audio Processing
      - openai-whisper==20231117
      - sounddevice==0.4.6
      - soundfile==0.12.1
      - numpy==1.24.3
      - scipy==1.11.4

      # arXiv Search
      - arxiv==2.1.0

      # Math/Calculation
      - sympy==1.12

      # Web Framework
      - fastapi==0.109.0
      - uvicorn[standard]==0.27.0
      - python-multipart==0.0.6

      # Frontend
      - streamlit>=1.31.0
      - streamlit-webrtc==0.47.1

      # Utilities
      - requests==2.31.0
      - pydantic==2.5.3
      - python-dotenv==1.0.0
      - aiofiles==23.2.1

      # Logging
      - loguru==0.7.2

      # Summarization (HuggingFace Transformers)
      - transformers>=4.30.0
      - sentencepiece>=0.1.99

      # Notion Integration
      - notion-client>=2.0.0

      # TTS (macOS specific)
      - pyttsx3>=2.99
      - pyobjc-core>=9.0
      - pyobjc-framework-Cocoa>=9.0

      # PyTorch (Apple Silicon / MPS)
      - torch>=2.0.0
      - torchaudio>=2.0.0
