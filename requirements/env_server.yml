name: ai-research-assistant-gpu
channels:
  - conda-forge
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.10
  - pytorch>=2.0.0
  - pytorch-cuda=12.1
  - torchaudio>=2.0.0
  - pip
  - pip:
      # Core AI/ML Libraries
      - langchain==0.1.0
      - langchain-core==0.1.10
      - langchain-community==0.0.13
      - openai==1.6.1
      - tiktoken==0.5.2

      # LLM Integration
      - ollama==0.1.6

      # Audio Processing
      - openai-whisper==20231117
      - sounddevice==0.4.6
      - soundfile==0.12.1
      - numpy==1.24.3
      - scipy==1.11.4

      # arXiv Search
      - arxiv==2.1.0

      # Math/Calculation
      - sympy==1.12

      # Web Framework
      - fastapi==0.109.0
      - uvicorn[standard]==0.27.0
      - python-multipart==0.0.6

      # Frontend
      - streamlit>=1.31.0
      - streamlit-webrtc==0.47.1

      # Utilities
      - requests==2.31.0
      - pydantic==2.5.3
      - python-dotenv==1.0.0
      - aiofiles==23.2.1

      # Logging
      - loguru==0.7.2

      # Summarization (HuggingFace Transformers)
      - transformers>=4.30.0
      - sentencepiece>=0.1.99
      - accelerate>=0.20.0

      # Notion Integration
      - notion-client>=2.0.0

      # TTS (System / pyttsx3 for Linux)
      - pyttsx3>=2.99

      # CosyVoice Dependencies (GPU deployment)
      - librosa>=0.10.0
      - hydra-core>=1.3.0
      - omegaconf>=2.3.0
      - onnxruntime-gpu>=1.15.0
      - pydub>=0.25.0

      # Note: CosyVoice should be installed separately:
      # git clone https://github.com/FunAudioLLM/CosyVoice.git
      # cd CosyVoice && pip install -r requirements.txt
